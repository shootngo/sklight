name: Bake icons and sync gh-pages
# Runs on every push to main: builds any pending icons, then copies main to gh-pages (the branch Pages serves).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and build icons
        run: |
          set -e
          if ls icons/jeanie-src.b64.part* >/dev/null 2>&1; then
            cat $(ls icons/jeanie-src.b64.part* | sort) | base64 -d > icons/jeanie-src.jpg
            git rm -q icons/jeanie-src.b64.part*
            pip install --quiet pillow
            python3 tools/build_icons.py
          fi
          for f in icons/*.b64; do
            [ -e "$f" ] || continue
            base64 -d "$f" > "${f%.b64}"
            git rm -q "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898613+github-actions[bot]@users.noreply.github.com"
          git add icons/
          git diff --cached --quiet || git commit -m "Build app icons"
          git push origin HEAD:main
          git push origin HEAD:gh-pages
